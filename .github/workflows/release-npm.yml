name: Release - Publish to npm

# Fires when a GitHub Release is published. Publishes only if the CI build
# gate passes. The npm token lives in the "npm" GitHub Environment secret
# (NPM_TOKEN) — never in the repo.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  build:
    name: Build gate
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm # <- secrets.NPM_TOKEN comes from this environment
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 12

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      # Fail early if the release tag and package.json disagree (e.g. tag v1.2.0
      # but package.json still says 1.1.0 -> npm would reject or publish wrong).
      - name: Verify tag matches package.json version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          if [ "${TAG#v}" != "$PKG_VERSION" ]; then
            echo "::error::Release tag '$TAG' does not match package.json version '$PKG_VERSION'. Bump version, then re-create the release."
            exit 1
          fi

      - name: Build
        run: pnpm build

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          # GitHub "pre-release" -> npm dist-tag "next" so it never becomes `latest`.
          TAG_ARGS=""
          if [ "$PRERELEASE" = "true" ]; then TAG_ARGS="--tag next"; fi
          pnpm publish --access public --no-git-checks $TAG_ARGS
